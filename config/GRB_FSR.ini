; GRB-FSR - AMD FSR upscaling for Ghost Recon Breakpoint (DirectX 11)
; Replaces the game's TAA / Temporal Injection pass with AMD FSR (FSR 4 where the GPU supports it).
; In game: Anti-Aliasing = TAA (Temporal Injection on). Pick the render resolution in the mod's menu (Home key)
; or with RenderScale below. Saving this file applies most changes in-game, no restart needed.

[Upscaler]
; Which upscaler replaces the game's TAA (read at game start):
;   fsr        = AMD FSR, built in (default). Needs amd_fidelityfx_loader_dx12.dll and
;                amd_fidelityfx_upscaler_dx12.dll next to this file, and no OptiScaler.
;                If the loader DLL is missing, the mod uses ngx instead.
;   ngx        = DLSS through NVIDIA NGX, or FSR 4 when OptiScaler is installed
;   bridgetest = development test of the DX11 -> DX12 bridge: a plain bilinear upscale (blurry, shimmers)
Backend=fsr

[FSR]
; auto = the newest FSR the AMD DLLs offer on this GPU (4.1 on RX 6000 and newer), or force a major version:
; 4, 3 (3.1, lighter: about 1 ms instead of 2 ms per frame at 1080p on an RX 6700S), 2. Also in the menu.
Version=auto
; FSR sharpening, 0 = off, up to 1. Also in the menu.
Sharpness=0
; ([DLSS] keys that also apply to FSR: Enabled, the keys, RenderScale, UseResponsiveMask (FSR reactive mask),
; DilatedMotionVectors, AutoExposureHDR.)

[DLSS]
; 1 = the upscaler replaces the game's TAA, 0 = mod does nothing
Enabled=1
; Key that switches between the upscaler and the game's own TAA while playing (virtual-key code, 0 = off). 0x23 = End
ToggleKey=0x23
; Key that opens the in-game menu (render scale %, FSR version and sharpness, on/off). 0x24 = Home
MenuKey=0x24
; NGX path only. DLSS preset: 0 = NVIDIA default, or a letter: F (CNN), J, K (DLSS 4 transformer), L, M (DLSS 4.5).
Preset=K
; NGX path only. Key that cycles presets in-game (virtual-key code, 0 = off)
PresetCycleKey=0
; Internal render resolution in percent of the output (25-100), or 0 = use the game's own Resolution Scale.
; 100 = native AA, 67 = Quality, 58 = Balanced, 50 = Performance, 33 = Ultra Performance
RenderScale=0
; Keys that raise / lower RenderScale in-game (0x21 = Page Up, 0x22 = Page Down), and the step in percent
RenderScaleUpKey=0x21
RenderScaleDownKey=0x22
RenderScaleStep=5
; NGX path only. auto = picked from the render scale. Or: dlaa, ultraquality, quality, balanced, performance,
; ultraperformance
QualityMode=auto
; Feed the game's "responsive AA" mask (particles, etc.) to the upscaler (FSR reactive mask / DLSS bias mask)
UseResponsiveMask=0
; 1 = build full-resolution dilated motion vectors (mainly useful for frame generation), 0 = low-res MVs
DilatedMotionVectors=0
; HDR only: let the upscaler compute exposure
AutoExposureHDR=1

[Compat]
; Report the D3D feature level the game asked for (needed when OptiScaler is installed)
ReportRequestedFeatureLevel=1
; Pass the game's real camera matrices to OptiScaler's DLSS frame generation (experimental)
FGCameraData=0

[Advanced]
; Multipliers for the game's sub-pixel jitter before it is passed to the upscaler (sign convention)
JitterScaleX=-1.0
JitterScaleY=-1.0
; -1 = auto-detect reversed depth from the game's projection, 0 = normal, 1 = reversed
DepthInverted=-1
; 0 = off, diagnostics: 1 = motion vectors, 2 = depth
DebugView=0
HookDelayMs=0

[Log]
; 0 = errors, 1 = info, 2 = debug
LogLevel=1
; 1 = include NVIDIA NGX log lines in GRB_FSR.log
NGXLogging=0
; developer: live commands via GRB_FSR_cmd.ini (probe, debug views)
DevCommands=0
